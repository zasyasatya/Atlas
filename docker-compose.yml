# Local / Coolify deployment for ATLAS.
services:
  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    image: atlas:latest
    container_name: atlas
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # --- branding (change these to rebrand; no rebuild needed) ------------
      ATLAS_APP_NAME: ${ATLAS_APP_NAME:-ATLAS}
      ATLAS_APP_TAGLINE: ${ATLAS_APP_TAGLINE:-Applied AI & Data Research Platform}
      ATLAS_APP_TAGLINE_SHORT: ${ATLAS_APP_TAGLINE_SHORT:-Applied AI Platform}
      # --- core -------------------------------------------------------------
      ATLAS_ENVIRONMENT: production
      ATLAS_SECRET_KEY: ${ATLAS_SECRET_KEY:-change-me-to-a-long-random-string}
      ATLAS_PUBLIC_BASE_URL: ${ATLAS_PUBLIC_BASE_URL:-http://localhost:8000}
      ATLAS_SEED_DEMO_DATA: ${ATLAS_SEED_DEMO_DATA:-true}
      # --- database (SQLite by default; swap for Postgres in production) ----
      ATLAS_DATABASE_URL: ${ATLAS_DATABASE_URL:-}
      # --- Colab GPU bridge -------------------------------------------------
      ATLAS_GITHUB_TOKEN: ${ATLAS_GITHUB_TOKEN:-}
      ATLAS_COLAB_GITHUB_REPO: ${ATLAS_COLAB_GITHUB_REPO:-}
      ATLAS_COLAB_GITHUB_BRANCH: ${ATLAS_COLAB_GITHUB_BRANCH:-main}
      # --- Kaggle GPU bridge ------------------------------------------------
      ATLAS_KAGGLE_USERNAME: ${ATLAS_KAGGLE_USERNAME:-}
      ATLAS_KAGGLE_KEY: ${ATLAS_KAGGLE_KEY:-}
      # --- deployment engine ------------------------------------------------
      ATLAS_DEPLOY_DRIVER: ${ATLAS_DEPLOY_DRIVER:-local_process}
      ATLAS_COOLIFY_BASE_URL: ${ATLAS_COOLIFY_BASE_URL:-}
      ATLAS_COOLIFY_TOKEN: ${ATLAS_COOLIFY_TOKEN:-}
      ATLAS_COOLIFY_PROJECT_UUID: ${ATLAS_COOLIFY_PROJECT_UUID:-}
      ATLAS_COOLIFY_SERVER_UUID: ${ATLAS_COOLIFY_SERVER_UUID:-}
      # --- app routing ------------------------------------------------------
      # ATLAS proxies /app/<slug>/ to the app's internal port, HTTP + WebSocket,
      # so the port mapping above is all the container needs: no nginx required,
      # nothing to install after a deploy.
      ATLAS_DEPLOY_BUILTIN_PROXY: ${ATLAS_DEPLOY_BUILTIN_PROXY:-true}
      ATLAS_DEPLOY_URL_PREFIX: ${ATLAS_DEPLOY_URL_PREFIX:-app}
      # --- reverse proxy (nginx) - optional, only to sit in front of ATLAS --
      # Blank by default: snippets + an installable atlas.conf are generated under
      # ./data/nginx. Set these to write and reload a live nginx automatically.
      ATLAS_NGINX_AUTO_INSTALL: ${ATLAS_NGINX_AUTO_INSTALL:-false}
      ATLAS_NGINX_CONF_DIR: ${ATLAS_NGINX_CONF_DIR:-}
      ATLAS_NGINX_VHOST_FILE: ${ATLAS_NGINX_VHOST_FILE:-}
      ATLAS_NGINX_RELOAD_CMD: ${ATLAS_NGINX_RELOAD_CMD:-}
      ATLAS_NGINX_AUTO_RELOAD: ${ATLAS_NGINX_AUTO_RELOAD:-true}
      ATLAS_NGINX_UPSTREAM: ${ATLAS_NGINX_UPSTREAM:-http://127.0.0.1:8000}
      # --- Google SSO -------------------------------------------------------
      ATLAS_GOOGLE_CLIENT_ID: ${ATLAS_GOOGLE_CLIENT_ID:-}
      ATLAS_GOOGLE_CLIENT_SECRET: ${ATLAS_GOOGLE_CLIENT_SECRET:-}
    volumes:
      # Bind-mount the repository's ./data directory onto the container's
      # storage so the database, uploads and deployed bundles live in a plain,
      # persistent folder on the host - easy to see, back up and port.
      - ./data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

# Named volume is no longer needed: ./data above is the persistent store.
# volumes:
#   atlas_storage:
